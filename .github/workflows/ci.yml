name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: Uji & evaluasi (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Siapkan Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Pasang dependensi
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Jalankan unit test
        run: pytest -v

      - name: Jalankan evaluasi detektor wabah
        # Membuktikan harness evaluasi tetap berjalan dan metrik dapat
        # direproduksi. Tidak memerlukan LLM/Ollama - murni deterministik.
        run: python evaluasi.py

      - name: Unggah laporan evaluasi
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: laporan-evaluasi
          path: EVALUASI.md
